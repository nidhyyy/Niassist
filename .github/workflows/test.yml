name: Tests
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-linux.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - run: npm ci
      - run: npm test
      - run: bash -n deploy/install_server.sh deploy/release.sh
